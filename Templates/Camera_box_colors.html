<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Box</title>
  <style>
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .camera-box {
      width: 300px;
      height: 400px;
      background: linear-gradient(145deg, #3e4a59, #2a2f38);
      border-radius: 20px;
      box-shadow: 10px 10px 30px #1a1d22, -10px -10px 30px #4c5668;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    .lens {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #444 20%, #111 70%);
      border-radius: 50%;
      border: 4px solid #888;
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 0 10px #000;
    }

    .lens-glare {
      width: 25px;
      height: 25px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 30px;
    }

    .flash {
      width: 30px;
      height: 10px;
      background-color: #f5f5f5;
      position: absolute;
      top: 25px;
      right: 25px;
      border-radius: 5px;
      box-shadow: 0 0 10px #fff;
    }

    .indicator {
      width: 12px;
      height: 12px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      top: 25px;
      left: 25px;
      box-shadow: 0 0 5px red;
    }

    .screen {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 150px;
      background-color: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 3px solid #444;
    }

    .screen::before {
      content: "Live Preview";
      color: #0f0;
      font-size: 16px;
      position: absolute;
      top: 5px;
      left: 10px;
      font-family: 'Courier New', Courier, monospace;
    }

    .shutter-btn {
      width: 50px;
      height: 20px;
      background-color: #444;
      border-radius: 10px;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 0 5px #000;
    }

    .label {
      position: absolute;
      bottom: 5px;
      font-size: 14px;
      color: #ccc;
      width: 100%;
      text-align: center;
      font-style: italic;
    }

  </style>
</head>
<body>
  <div class="camera-box">
    <div class="lens">
      <div class="lens-glare"></div>
    </div>
    <div class="flash"></div>
    <div class="indicator"></div>
    <div class="screen"></div>
    <div class="shutter-btn"></div>
    <div class="label">Camera v1.0</div>
  </div>
</body>
</html>
